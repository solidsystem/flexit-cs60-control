CONFIG_GPIO=y
CONFIG_BOOTLOADER_MCUBOOT=y

# Logging via the existing CDC-ACM console (printk goes here too).
CONFIG_LOG=y

# --- MCUmgr / SMP server over the CDC-ACM UART ---
# The board already chooses zephyr,uart-mcumgr = &board_cdc_acm_uart,
# so the UART transport lands on USB CDC-ACM automatically.
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# Command groups exposed over SMP.
# Image upload/list/test/confirm; OS reset is part of the OS group.
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Backing store for image uploads: writes the blob into MCUboot's secondary slot.
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Dependencies pulled in by MCUmgr.
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y

# A bit more stack/heap for the SMP processing thread and BLE host work.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# RS-485 receive on UART0 (D4=RX, D5=TX, D2=DE/RE) via the
# XIAO-RS485-Expansion-Board. We use the interrupt-driven UART API and feed
# bytes into a ring buffer that the system workqueue drains.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# --- Bluetooth Low Energy ---
# Peripheral that exposes:
#   - SMP service (DFU over BLE, gated by passkey-authenticated pairing)
#   - Nordic UART Service (console output mirror)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="flexitMC3"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_RX_STACK_SIZE=2048

# Security Manager + fixed passkey. Bonding is enabled and persisted in NVS
# (storage_partition in the board overlay) so macOS can reconnect using the
# stored LTK without a fresh passkey prompt. The storage partition lives at
# the end of flash, outside MCUboot's slots/scratch, so the bond survives
# firmware DFU swaps as well.
CONFIG_BT_SMP=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Larger MTU/ACL buffers for faster DFU throughput.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=2

# Nordic UART Service (NCS).
CONFIG_BT_NUS=y

# SMP/MCUmgr transport over BLE — gated to authenticated (passkey-paired)
# connections only; pair-less centrals get permission errors.
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y

# Route printk through the log subsystem so the NUS log backend can mirror
# it over BLE. The default UART log backend keeps the USB CDC console alive.
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
