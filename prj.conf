CONFIG_GPIO=y
CONFIG_BOOTLOADER_MCUBOOT=y

# Logging via the existing CDC-ACM console (printk goes here too).
CONFIG_LOG=y

# --- MCUmgr / SMP server over the CDC-ACM UART ---
# The board already chooses zephyr,uart-mcumgr = &board_cdc_acm_uart,
# so the UART transport lands on USB CDC-ACM automatically.
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# Command groups exposed over SMP.
# Image upload/list/test/confirm; OS reset is part of the OS group.
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Backing store for image uploads: writes the blob into MCUboot's secondary slot.
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Dependencies pulled in by MCUmgr.
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y

# A bit more stack/heap for the SMP processing thread and BLE host work.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# RS-485 receive on UART0 (D4=RX, D5=TX, D2=DE/RE) via the
# XIAO-RS485-Expansion-Board. The async UART API drives the UARTE peripheral
# in continuous DMA mode (double-buffered, 256 B per buffer = ~22 ms of
# headroom at 115200 baud) so long bursts can't be lost while BLE host work
# briefly delays the application.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
# MCUMGR_TRANSPORT_UART forces UART_INTERRUPT_DRIVEN=y globally for the
# CDC-ACM console, which would also pick uart0 into IRQ mode and lock
# UART_0_ASYNC out. Pin uart0 to async-only here.
CONFIG_UART_0_INTERRUPT_DRIVEN=n
CONFIG_RING_BUFFER=y

# --- Bluetooth Low Energy ---
# Peripheral that exposes:
#   - SMP service (DFU over BLE, gated by passkey-authenticated pairing)
#   - Nordic UART Service (console output mirror)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="flexit-cs60-control"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_RX_STACK_SIZE=2048

# Security Manager + app-provided passkey (set at build time from
# $FLEXIT_CS60_CONTROL_BLE_KEY, see CMakeLists.txt). Bonding is enabled and persisted in NVS
# (storage_partition in the board overlay) so macOS can reconnect using the
# stored LTK without a fresh passkey prompt. The storage partition lives at
# the end of flash, outside MCUboot's slots/scratch, so the bond survives
# firmware DFU swaps as well.
CONFIG_BT_SMP=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y

# LE Secure Connections generates a P-256 key pair via the PSA crypto stack
# (nRF Security). Two resources must be sized for this, or BLE pairing — and
# therefore BLE DFU — fails:
#   1. mbedTLS heap. The Kconfig default (512 B) is far too small:
#      psa_generate_key() fails with PSA_ERROR_INSUFFICIENT_MEMORY (-141), the
#      local public key is never produced, and SC pairing stalls after the
#      peer's public key arrives, timing out after 30 s.
#   2. The BLE "long workqueue" stack. ecc.c runs the (stack-heavy) P-256
#      keygen on bt_long_wq; the 1800 B default overflows mid-keygen once the
#      heap is large enough for the computation to actually run, tripping the
#      MPU stack guard and faulting at boot.
# Sized here for ECC keygen alongside the concurrent Zigbee/ZBOSS crypto. 8192
# was enough on a freshly-booted device but still too tight in the field: it
# shares the heap with active ZBOSS crypto, so once Zigbee has consumed heap a
# *fresh* SC pairing intermittently stalls at -141 (a just-booted device pairs
# fine, and bond reuse needs no keygen, both of which masked it). 16384 gives
# keygen headroom over concurrent ZBOSS.
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_BT_LONG_WQ_STACK_SIZE=4096

# Always-on device: reboot on a fatal error instead of halting. Also makes an
# unconfirmed DFU test image that faults revert cleanly on the auto-reset
# (MCUboot swaps the previous good image back) rather than wedging the board.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Larger MTU/ACL buffers for faster DFU throughput.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=2

# --- BLE DFU throughput ---
# The big MTU/buffers above are wasted without these. By default the link-layer
# payload (DLE) is capped at 27 B, the connection stays at the central's slow
# default interval, and the radio uses the 1M PHY — so a ~0.5 MB image takes
# ~13 min over BLE. Together these take it to well under a minute:
#   - DLE up to 251 B link-layer payloads (BT_AUTO_DATA_LEN_UPDATE already on).
#   - Auto-switch to the 2M PHY (controller already advertises 2M support).
#   - Let MCUmgr request a fast connection interval while a DFU is in progress.
#   - Advertise SMP buffer params so a client can size its chunks.
#   - Erase the secondary slot progressively instead of all up front.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Nordic UART Service (NCS). Gate it to authenticated (passkey-paired)
# connections, same as the SMP transport below. Without this the NUS RX/TX
# characteristics default to plain READ|WRITE permissions, so commands are
# serviced over an unencrypted link before the firmware-initiated security
# upgrade resolves — leaking panel state and accepting mode/setpoint/zbreset
# from unpaired centrals, and making `state` pairing race (unlike `list`,
# whose auth-gated SMP access drives pairing deterministically).
CONFIG_BT_NUS=y
CONFIG_BT_NUS_AUTHEN=y

# SMP/MCUmgr transport over BLE — gated to authenticated (passkey-paired)
# connections only; pair-less centrals get permission errors.
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y

# MCUmgr image-upload notification hooks: let the app suspend the Zigbee stack
# while a DFU upload is in flight so the shared 2.4 GHz radio is handed to BLE.
# As a router the 802.15.4 side keeps the radio busy (continuous RX, relaying,
# channel scans), which starves the BLE link and times out a sustained DFU
# upload; zigbee_ep.c hooks DFU_STARTED/STOPPED to suspend/resume ZBOSS. See
# CONFIG_ZIGBEE_DEBUG_FUNCTIONS below.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y

# Route printk through the log subsystem so the NUS log backend can mirror
# it over BLE. The default UART log backend keeps the USB CDC console alive.
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y

# --- Zigbee (802.15.4) router, concurrent with BLE via MPSL ---
# The ncs-zigbee add-on (registered as an extra Zephyr module in CMakeLists)
# provides the ZBOSS stack. This runs a router alongside the BLE peripheral;
# MPSL/the SoftDevice Controller arbitrate the shared radio. Partition layout is
# in pm_static_xiao_ble_nrf52840.yml.
#
# Router (not end device): the XIAO is permanently USB-powered, so there is no
# battery reason to be an end device — and the end-device role caused HA fan/
# setpoint writes to fail. An rx-on-when-idle end device has a single parent and
# relies on it both to deliver downstream frames and to answer route requests on
# its behalf. When the parent ages the child out (or the parent link goes stale)
# the coordinator gets NO_ROUTE / ROUTE_DISCOVERY_UNDERWAY and downstream writes
# die, while the device still blindly pushes reports upstream — so sensors keep
# updating but control silently breaks. A router maintains its own routes (link
# status / route records), is always directly addressable, and is never aged out
# as someone's child, which removes that whole failure class. (Diagnosed from a
# ZHA debug log: cluster 0x0202 FanMode writes to the XIAO returned NO_ROUTE.)
# NOTE: switching role changes the device type in the PAN, so the device must
# leave and re-pair (zbreset + ZHA permit-join) after flashing this build.
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y

# Compile in zigbee_debug_suspend/resume_zboss_thread(). zigbee_ep.c calls these
# from the MCUmgr DFU hooks (above) to hand the radio to BLE during a firmware
# upload. The device resets after a successful DFU, so suspending ZBOSS across
# the upload is harmless; an aborted upload resumes it. (The Kconfig help warns
# these can cause instability if misused — here they are only ever used around a
# DFU that ends in a reboot.)
CONFIG_ZIGBEE_DEBUG_FUNCTIONS=y

# Scan all 802.15.4 channels (11-26) to find the Home Assistant coordinator's
# network, rather than the default single-channel (16) mode. Nordic recommends
# CHANNEL_SELECTION_MODE_MULTI when joining a third-party coordinator (ZHA/Z2M),
# since we don't control which channel HA forms its network on.
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# How long the zigbee is open for pairing after reset/start, when device is not 
# previously paired, or zbreset has been used.
CONFIG_ZIGBEE_DEV_REJOIN_TIMEOUT_MS=60000

# ZBOSS needs a bit more heap than the BLE-only build.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# QSPI NOR driver — the MCUboot DFU secondary slot lives in the XIAO BLE's
# onboard 2 MB QSPI flash (p25q16h), so the app must be able to write the
# uploaded image there via the flash map. This moves the dual-slot pressure off
# the 1 MB internal flash; see smarthouse-integration.md "flash budget".
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
