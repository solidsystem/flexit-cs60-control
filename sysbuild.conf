# Enable MCUboot bootloader compilation via Sysbuild
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# The Zigbee add-on requires Partition Manager (it selects PM_SINGLE_IMAGE and
# addresses the ZBOSS NVRAM via PM_* partitions). Enable it and provide the
# layout in pm_static_xiao_ble_nrf52840.yml. MCUboot defaults to
# swap-using-move, so no scratch partition is needed.
SB_CONFIG_PARTITION_MANAGER=y

# Place the MCUboot secondary (DFU staging) slot in the XIAO BLE's onboard 2 MB
# QSPI flash instead of internal flash. This frees ~half of the 1 MB internal
# flash so the BLE + Zigbee image fits comfortably in a single large primary
# slot. Requires nordic,pm-ext-flash chosen in the app + mcuboot DTS overlays
# and the QSPI NOR driver in both images.
SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
