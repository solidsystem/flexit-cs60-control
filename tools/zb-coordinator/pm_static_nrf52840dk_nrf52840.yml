# Static PM layout for the test Zigbee network coordinator (single image, no MCUboot).
# nRF52840 1 MB flash. Forces PM to place the ZBOSS NVRAM/product-config partitions,
# which dynamic PM otherwise drops for Zigbee on nrf52840 (PM_ZBOSS_NVRAM_ID undeclared).
# settings_storage is unused by the coordinator but kept for layout parity / harmless.
app:
  address: 0x0
  end_address: 0xf6000
  region: flash_primary
  size: 0xf6000
settings_storage:
  address: 0xf6000
  end_address: 0xf7000
  region: flash_primary
  size: 0x1000
zboss_product_config:
  address: 0xf7000
  end_address: 0xf8000
  region: flash_primary
  size: 0x1000
zboss_nvram:
  address: 0xf8000
  end_address: 0x100000
  region: flash_primary
  size: 0x8000
