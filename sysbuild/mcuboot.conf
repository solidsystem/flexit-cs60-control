# MCUboot configuration for XIAO BLE.
#
# The board defaults pull in CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y so the
# console is wired to board_cdc_acm_uart. For MCUboot, the USB device stack is
# explicitly disabled (Kconfig.cdc_acm_serial.defconfig: USB_DEVICE_STACK_NEXT
# is `default y if !MCUBOOT`). The result: uart_console.c links against a
# CDC-ACM device whose driver is never compiled in -> undefined reference to
# __device_dts_ord_122.
#
# Drop the console for the bootloader. MCUboot doesn't need stdout to do its
# job and this keeps the bootloader small.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# The DFU secondary slot is in the onboard QSPI flash, so MCUboot needs the
# QSPI NOR driver to read/erase/copy it during a swap. The larger primary slot
# also needs a higher sector ceiling.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_BOOT_MAX_IMG_SECTORS=256
